<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Billing Demo</title>
    <style>
        body {
            margin: 0;
            background: #fff;
            color: #222;
            font-family: Arial, sans-serif;
        }

        main {
            max-width: 560px;
            margin: 40px auto;
            padding: 0 16px;
        }

        h1 {
            margin-bottom: 8px;
            font-size: 24px;
        }

        p {
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 14px;
        }

        form {
            display: grid;
            gap: 12px;
        }

        label {
            display: block;
            margin-bottom: 4px;
            font-size: 14px;
            font-weight: 600;
        }

        input, select, textarea, button {
            width: 100%;
            box-sizing: border-box;
            padding: 8px;
            font-size: 14px;
            font-family: inherit;
        }

        textarea {
            min-height: 72px;
            resize: vertical;
        }

        button {
            cursor: pointer;
        }

        #result {
            margin-top: 24px;
            border-top: 1px solid #ddd;
            padding-top: 16px;
        }

        .row {
            margin: 6px 0;
            font-size: 14px;
        }

        .field-group {
            margin-top: 10px;
        }

        .field-title {
            font-weight: 600;
            margin-bottom: 4px;
        }
    </style>
</head>
<body>
<main>
    <h1>Billing Demo</h1>
    <p>Submit the same Order Number twice to see duplicate/idempotent behavior.</p>

    <form id="order-form">
        <div>
            <label for="orderNumber">Order Number</label>
            <input id="orderNumber" name="orderNumber" required maxlength="64">
        </div>

        <div>
            <label for="userId">User Id</label>
            <input id="userId" name="userId" required maxlength="128">
        </div>

        <div>
            <label for="amount">Amount</label>
            <input id="amount" name="amount" type="number" step="0.01" min="0.01" required>
        </div>

        <div>
            <label for="paymentGateway">Payment Gateway</label>
            <select id="paymentGateway" name="paymentGateway" required>
                <option value="MockSuccess">MockSuccess</option>
                <option value="MockFailure">MockFailure</option>
                <option value="MockRetry">MockRetry</option>
            </select>
        </div>

        <div>
            <label for="description">Description</label>
            <textarea id="description" name="description" maxlength="500"></textarea>
        </div>

        <button type="submit">Submit</button>
    </form>

    <section id="result" aria-live="polite"></section>
</main>
<script src="app.js"></script>
</body>
</html>
